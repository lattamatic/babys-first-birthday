<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bhuvi Tara's First Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>

  <div class="confetti-bar" aria-hidden="true"></div>

  <header class="hero" id="top">
    <div class="hero-inner">
      <div class="hero-photo">
        <div class="hero-photo-frame">
          <img id="hero-photo" alt="" width="900" height="1125" fetchpriority="high" />
        </div>
        <div class="hero-badge" aria-hidden="true">
          <span class="hero-badge-number">1</span>
          <span class="hero-badge-label">year</span>
        </div>
      </div>

      <div class="hero-text">
        <h1 class="hero-title">
          <span class="hero-script" id="hero-script">Bhuvi</span>
          <span class="hero-caps" id="hero-caps">Turns one</span>
        </h1>
        <div class="party-card" id="party-card">
          <div class="party-row"><span class="party-icon">📅</span><span id="party-date"></span></div>
          <div class="party-row"><span class="party-icon">🕑</span><span id="party-time"></span></div>
          <div class="party-row"><span class="party-icon">📍</span><span id="party-location"></span></div>
        </div>
        <p class="party-note" id="party-note"></p>
        <a href="gifts.html" class="cta-button">Gift Ideas &amp; Registry</a>
      </div>
    </div>
    <div class="hero-blob" aria-hidden="true"></div>
  </header>

  <main>

    <section class="section about-section">
      <div class="section-inner">
        <h2>Our Happy Girl</h2>
        <p class="about-blurb" id="about-blurb"></p>
      </div>
    </section>

    <section class="section story-section" id="story">
      <div class="section-inner section-inner-wide">
        <h2 id="story-title"></h2>
        <p class="section-subtitle" id="story-subtitle"></p>
        <nav aria-label="Jump to a month">
          <ol class="story-strip" id="story-strip"></ol>
        </nav>
        <ol class="story" id="story-list"></ol>
      </div>
    </section>

    <section class="finale" id="story-finale" hidden>
      <div class="finale-text">
        <p class="chapter-month"></p>
        <h2 class="finale-title"></h2>
      </div>
      <figure class="finale-photo">
        <img width="960" height="892" loading="lazy" alt="" />
      </figure>
    </section>

    <section class="section gifts-teaser-section" id="gifts">
      <div class="section-inner">
        <h2>Gifts</h2>
        <p class="gifts-intro" id="gifts-intro"></p>
        <a href="gifts.html" class="cta-button cta-button-secondary">See the Full Gift List →</a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p class="footer-sub">Made with love, one chapter at a time.</p>
  </footer>

  <script src="content.js?v=10"></script>
  <script src="js/main.js?v=7"></script>
  <script src="js/to-top.js?v=1"></script>
</body>
</html>
