<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gift List · Bhuvi Tara's First Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=7" />
</head>
<body>

  <div class="confetti-bar" aria-hidden="true"></div>

  <header class="gifts-page-header">
    <div class="gifts-page-header-inner">
      <a href="index.html" class="back-link">← Back to the party page</a>
      <p class="chapter-label" id="chapter-label"></p>
      <h1>Gift List</h1>
      <p class="gifts-intro" id="gifts-intro"></p>
      <p class="affiliate-disclosure" id="affiliate-disclosure" hidden></p>
    </div>
  </header>

  <main>
    <section class="section gifts-plp-section">
      <div class="section-inner section-inner-wide">

        <p class="filter-label">Category</p>
        <div class="filter-bar" id="category-filters"></div>

        <label class="claimed-toggle">
          <input type="checkbox" id="hide-claimed-checkbox" autocomplete="off" />
          Hide gifts that are already taken
        </label>

        <p class="gift-status" id="gift-status" role="status" tabindex="-1" hidden></p>

        <div class="gift-grid" id="gift-grid"></div>
        <p class="empty-state" id="empty-state" hidden>No gifts match this filter — try another category.</p>

        <p class="gifts-ideas-note" id="gifts-ideas-note"></p>
      </div>
    </section>
  </main>

  <dialog class="claim-dialog" id="claim-dialog" aria-labelledby="claim-title">
    <form method="dialog" id="claim-form" novalidate>
      <h2 id="claim-title">Lovely choice!</h2>
      <p class="claim-item" id="claim-item"></p>
      <p class="claim-explain">We'll mark it as taken so nobody else buys the same one. Only we can see your name.</p>

      <label class="claim-field">
        <span>Your name</span>
        <input type="text" id="claim-name" maxlength="60" autocomplete="given-name" required />
      </label>

      <label class="claim-field" id="claim-code-field" hidden>
        <span>Party code <small>(it's on your invitation)</small></span>
        <input type="text" id="claim-code" autocomplete="off" autocapitalize="off" />
      </label>

      <p class="claim-error" id="claim-error" role="alert" hidden></p>

      <div class="claim-actions">
        <button type="button" class="claim-cancel" id="claim-cancel">Cancel</button>
        <button type="submit" class="claim-confirm" id="claim-confirm">I've chosen this</button>
      </div>
    </form>
  </dialog>

  <footer class="site-footer">
    <p id="footer-chapter"></p>
    <p class="footer-sub">Made with love, one chapter at a time.</p>
  </footer>

  <script src="content.js?v=7"></script>
  <script src="js/gifts.js?v=4"></script>
</body>
</html>
