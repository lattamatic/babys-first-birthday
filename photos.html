<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Party Photos · Bhuvi Tara's First Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=17" />
</head>
<body>

  <div class="confetti-bar" aria-hidden="true"></div>

  <header class="gifts-page-header">
    <div class="gifts-page-header-inner">
      <a href="index.html" class="back-link">← Back to the party page</a>
      <h1 id="photos-title">Party photos</h1>
      <p class="gifts-intro" id="photos-intro"></p>
      <a class="cta-button" id="photos-add" target="_blank" rel="noopener">Add your photos</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-inner section-inner-wide">
        <p class="gift-status" id="photos-status" role="status">Loading photos…</p>
        <div class="photo-filters" id="photo-filters" role="group" aria-label="Show" hidden>
          <button type="button" class="photo-filter" data-filter="all" aria-pressed="true">All</button>
          <button type="button" class="photo-filter" data-filter="image" aria-pressed="false">Photos</button>
          <button type="button" class="photo-filter" data-filter="video" aria-pressed="false">Videos</button>
        </div>
        <div class="photo-grid" id="photo-grid"></div>
        <iframe class="photos-frame" id="photos-frame" title="Shared party photos" loading="lazy" hidden></iframe>
        <p class="photos-fallback"><a id="photos-open" target="_blank" rel="noopener">Open the album in Google Drive</a> if the photos don't show above.</p>
      </div>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous">‹</button>
    <div class="lightbox-stage" id="lightbox-stage"></div>
    <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next">›</button>
  </dialog>

  <footer class="site-footer">
    <p class="footer-sub">Made with love, one chapter at a time.</p>
  </footer>

  <script src="content.js?v=21"></script>
  <script src="js/photos.js?v=4"></script>
  <script src="js/to-top.js?v=1"></script>
</body>
</html>
